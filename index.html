<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> | متجر إلكتروني</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">Amaron</div>
  <div class="search"><input id="searchInput" placeholder="ابحث عن منتج..."><span>⌕</span></div>
  <div class="cart">🛒 <span id="cartCount">0</span></div>
</header>

<nav class="nav">
  <span>الرئيسية</span><span>العروض</span><span>الأكثر مبيعاً</span><span>جديد</span>
</nav>

<main>
  <section class="hero">
    <div><small>عروض مميزة</small><h1>تسوق بسهولة وبأفضل الأسعار</h1><p>منتجات مختارة وتوصيل سريع.</p></div>
    <div class="hero-art">SHOP</div>
  </section>

  <h2>المنتجات</h2>
  <section id="products" class="grid"></section>
</main>

<section id="orderPage" class="order-page hidden">
  <button class="back" id="backBtn">← العودة للمنتجات</button>
  <div class="order-card">
    <div class="selected-product" id="selectedProduct"></div>
    <div>
      <h2>معلومات الطلب</h2>
      <p class="muted">أدخل معلوماتك لإتمام طلبك.</p>
      <form id="orderForm">
        <input type="hidden" id="productName">
        <label>الاسم الكامل *<input id="fullName" required></label>
        <label>رقم الهاتف *<input id="phone" type="tel" required></label>
        <label>البريد الإلكتروني <span>(اختياري)</span><input id="email" type="email"></label>
        <label>المدينة *<input id="city" required></label>
        <label>العنوان *<textarea id="address" required rows="3"></textarea></label>
        <label>الكمية *<input id="quantity" type="number" min="1" value="1" required></label>
        <button class="submit" type="submit">تأكيد الطلب</button>
        <p id="status"></p>
      </form>
    </div>
  </div>
</section>

<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
